name: Offer Letter Automation

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth google-api-python-client bs4 playwright

      - name: Install Playwright Browsers
        run: |
          playwright install chromium

      - name: Install MS Fonts (Fix layout issues)
        run: |
          sudo apt-get update
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo apt-get install -y ttf-mscorefonts-installer fonts-indic fonts-noto fonts-deva
          sudo fc-cache -f -v

      - name: Create Google Credentials File
        run: |
          cat << 'EOF' > credentials.json
          ${{ secrets.GCP_CREDENTIALS }}
          EOF

      - name: Run Automation Script
        run: |
          python automation.py
